        especialidad: "Rodocrositas de Sweet Home y Cuarzo Ahumado",
        origen: "Mineraly / EventsEye",
        lat: 39.7817, lon: -104.9719
      }
    ];

    let bloqueActivo = 'todos';

    function renderizarFerias(lista) {
      const container = document.getElementById('listaFerias');
      document.getElementById('contadorEventos').textContent = lista.length;

      if (lista.length === 0) {
        container.innerHTML = `
          &lt;div class="bg-[#131316] border border-[#2e2e36] rounded-2xl p-8 text-center"&gt;
            &lt;span class="material-symbols-outlined text-4xl text-zinc-600 mb-2"&gt;travel_explore&lt;/span&gt;
            &lt;h3 class="text-white font-semibold text-base"&gt;No se encontraron ferias&lt;/h3&gt;
            &lt;p class="text-zinc-400 text-xs mt-1"&gt;Prueba buscando otro país, ciudad o restablece los filtros.&lt;/p&gt;
            &lt;button onclick="seleccionarBloque('todos')" class="mt-3 text-xs text-emerald-400 font-semibold underline"&gt;Ver todas las ferias&lt;/button&gt;
          &lt;/div&gt;
        `;
        return;
      }

      container.innerHTML = lista.map(f =&gt; `
        &lt;article class="bg-[#131316] border border-[#2e2e36] hover:border-emerald-500/40 rounded-2xl p-4 transition-all duration-200 hover:shadow-lg hover:shadow-black/60"&gt;
          &lt;div class="flex items-start justify-between gap-3"&gt;
            &lt;div class="space-y-1 flex-1"&gt;
              &lt;div class="flex items-center gap-2"&gt;
                &lt;span class="text-lg"&gt;${f.flag}&lt;/span&gt;
                &lt;span class="text-[10px] font-mono uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20"&gt;${f.pais}&lt;/span&gt;
                &lt;span class="text-[10px] text-zinc-400 font-mono"&gt;${f.edicion}&lt;/span&gt;
              &lt;/div&gt;
              &lt;h3 class="text-base font-bold text-white tracking-tight leading-snug"&gt;${f.titulo}&lt;/h3&gt;
              &lt;p class="text-xs text-zinc-400 flex items-center gap-1"&gt;
                &lt;span class="material-symbols-outlined text-xs text-zinc-500"&gt;location_on&lt;/span&gt;
                &lt;span&gt;${f.lugar}, ${f.ciudad}&lt;/span&gt;
              &lt;/p&gt;
            &lt;/div&gt;
            &lt;div class="text-right whitespace-nowrap"&gt;
              &lt;span class="text-[11px] font-mono font-semibold text-emerald-400 block"&gt;${f.fecha.split(' ')[0]} ${f.fecha.split(' ')[1] || ''}&lt;/span&gt;
              &lt;span class="text-[9px] text-zinc-500 font-mono block"&gt;${f.fecha}&lt;/span&gt;
            &lt;/div&gt;
          &lt;/div&gt;

          &lt;div class="mt-3 pt-3 border-t border-[#242429] flex flex-wrap items-center justify-between gap-2 text-xs"&gt;
            &lt;div class="flex items-center gap-2 text-[11px] text-zinc-400"&gt;
              &lt;span class="text-zinc-500"&gt;Enfoque:&lt;/span&gt;
              &lt;span class="text-zinc-300 font-medium"&gt;${f.especialidad}&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class="flex items-center gap-2"&gt;
              &lt;a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(f.titulo + ' ' + f.ciudad)}" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 bg-[#1b1b1f] hover:bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg border border-[#2e2e36] text-[11px] transition-colors"&gt;
                &lt;span class="material-symbols-outlined text-xs text-emerald-400"&gt;near_me&lt;/span&gt;
                &lt;span&gt;GPS&lt;/span&gt;
              &lt;/a&gt;
              &lt;a href="rutas.html?destino=${encodeURIComponent(f.ciudad)}" class="flex items-center gap-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-lg border border-emerald-500/30 text-[11px] font-semibold transition-colors"&gt;
                &lt;span class="material-symbols-outlined text-xs"&gt;directions_subway&lt;/span&gt;
                &lt;span&gt;Cómo Llegar&lt;/span&gt;
              &lt;/a&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/article&gt;
      `).join('');
    }

    function seleccionarBloque(bloque) {
      bloqueActivo = bloque;
      document.querySelectorAll('.bloque-btn').forEach(btn =&gt; {
        if (btn.dataset.bloque === bloque) {
          btn.className = 'bloque-btn active bg-emerald-500 text-black font-semibold px-3.5 py-1.5 rounded-lg whitespace-nowrap transition-all';
        } else {
          btn.className = 'bloque-btn bg-[#131316] text-zinc-400 border border-[#2e2e36] px-3.5 py-1.5 rounded-lg whitespace-nowrap hover:text-white hover:border-zinc-500 transition-all';
        }
      });
      filtrarFerias();
    }

    function filtrarFerias() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      document.getElementById('clearBtn').classList.toggle('hidden', q.length === 0);

      const filtradas = feriasData.filter(f =&gt; {
        const coincideBloque = (bloqueActivo === 'todos') || (f.bloque === bloqueActivo);
        const coincideBusqueda = !q || 
          f.titulo.toLowerCase().includes(q) ||
          f.ciudad.toLowerCase().includes(q) ||
          f.pais.toLowerCase().includes(q) ||
          f.especialidad.toLowerCase().includes(q) ||
          f.lugar.toLowerCase().includes(q);
        return coincideBloque && coincideBusqueda;
      });

      renderizarFerias(filtradas);
    }

    function limpiarBusqueda() {
      document.getElementById('searchInput').value = '';
      filtrarFerias();
    }

    // Inicializar
    renderizarFerias(feriasData);
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
    </div>
  </div>

  <script>
    function copiarCodigo() {
      const copyText = document.getElementById("rawCode");
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value).then(() => {
        const btn = document.getElementById("btnText");
        btn.textContent = "¡Copiado con Éxito!";
        setTimeout(() => {
          btn.textContent = "Copiar Código Completo";
        }, 2500);
      });
    }
  </script>
</body>
